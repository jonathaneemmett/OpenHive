[project]
name = "openhive"
version = "0.1.0"
description = "Self-hosted AI assistant MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
openhive = "openhive.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
